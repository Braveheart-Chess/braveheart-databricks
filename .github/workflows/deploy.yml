name: Deploy

# A merge to main deploys the bundle (databricks.yml, target prod) to
# braveheart-databricks-prod, signed in as the project's deployer through GitHub
# OIDC: Databricks trusts GitHub's token for this repository's `prod`
# environment only (jaws's databricks-workspace deployer), so
# no secret exists anywhere. Deploying never runs a job; runs are started by
# hand in the workspace.
#
# The environment `prod` (deployable from main only) and its variables are the
# owner's: DATABRICKS_HOST (the workspace URL), DATABRICKS_CLIENT_ID (the
# deployer's application ID, from the Databricks apply's output) and
# DATABRICKS_TOKEN_AUDIENCE (the Databricks account ID, the audience the
# deployer's federation policy trusts).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Deploys queue behind each other and are never cancelled mid-way.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to prod
    # A dispatch from another branch is skipped here rather than refused by the
    # environment's branch rule.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write # GitHub's OIDC token, exchanged for a Databricks one
      contents: read
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_TOKEN_AUDIENCE: ${{ vars.DATABRICKS_TOKEN_AUDIENCE }}
      BUNDLE_VAR_deployer_application_id: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      # First: the repository is public and vars are not masked, so the CLI
      # would print the host and the deployer's application ID into the log.
      - name: Mask the identifiers
        run: |
          echo "::add-mask::$DATABRICKS_HOST"
          echo "::add-mask::${DATABRICKS_HOST#https://}"
          echo "::add-mask::$DATABRICKS_CLIENT_ID"
          echo "::add-mask::$DATABRICKS_TOKEN_AUDIENCE"
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@v1.27.0
      - name: Sign in as the deployer
        run: databricks current-user me --output json | jq -r '"signed in as " + .displayName'
      - name: Validate the bundle
        run: databricks bundle validate -t prod
      - name: Deploy
        run: databricks bundle deploy -t prod
