name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# One run per PR; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    # Dependabot's commit messages carry a capitalised subject and a release
    # notes body, which this repo's one-line rule rejects. Its PRs are squash
    # merged under a lowercase Conventional Commit title instead, so the
    # commit that lands on main still conforms. A skipped job satisfies the
    # required status check.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit in the PR range is checked, so rebase merges land
          # only one-line Conventional Commits on main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint every commit in base..head
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
      - name: Unit test the commitlint rules and the scopes, and check the fixtures
        run: npm run test:commitlint

  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Squash merges use the PR title as the commit message, so it goes
      # through the same commitlint config as a commit: type, scope, case and
      # length. Dependabot's `chore(deps): ...` titles pass as they are.
      - name: Lint the title as a commit header
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The Spark tests fail here rather than skip: CI is where they always run.
      SPARK_TESTS: required
      # So do the tests that hold the NNUE port to the engine's net file.
      NET_TESTS: required
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v10.3.3 # no v10 major tag exists
        with:
          # Serverless environment 6, where the notebook runs.
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The engine's public net file, checked by its SHA-256 (nnue.py names both).
      - name: Fetch the net the NNUE tests read
        run: >-
          PYTHONPATH=src uv run python -c
          "from pathlib import Path; from selfplay_analysis import nnue;
          path = Path('tests/fixtures') / f'{nnue.NET_ID}.nnue';
          path.parent.mkdir(parents=True, exist_ok=True);
          path.write_bytes(nnue.download_net())"
      - run: uv run pytest

  bundle-schema:
    name: Bundle schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@v1.27.0
      - uses: astral-sh/setup-uv@v10.3.3 # no v10 major tag exists
      # Offline: `bundle validate` needs a workspace login, which pull requests never hold.
      - name: Check the bundle against the CLI's schema
        run: |
          databricks bundle schema > "$RUNNER_TEMP/bundle-schema.json"
          uvx check-jsonschema@0.39.0 --schemafile "$RUNNER_TEMP/bundle-schema.json" databricks.yml resources/*.yml
